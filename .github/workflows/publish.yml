name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
      contents: write # to create the GitHub release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need every tag to find the previous release for the compare link

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false # never use caching in release builds

      - run: npm ci

      - run: npm test

      - name: Publish to npm
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *alpha* ]]; then
            npm publish --provenance --access public --tag alpha
          elif [[ "$tag" == *beta* ]]; then
            npm publish --provenance --access public --tag beta
          elif [[ "$tag" == *rc* ]]; then
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          display_name=$(node -p "require('./package.json').signalk.displayName")

          notes=$(awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1 }
              next
            }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')

          prev_tag=$(git tag --sort=-v:refname -l 'v*.*.*' | awk -v cur="$tag" 'found { print; exit } $0 == cur { found=1 }')
          if [[ -n "$prev_tag" ]]; then
            notes="${notes}"$'\n\n'"**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${tag}"
          fi

          prerelease_flag=()
          if [[ "$tag" == *alpha* || "$tag" == *beta* || "$tag" == *rc* ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "$tag" --title "${display_name} ${version}" --notes "$notes" "${prerelease_flag[@]}"
